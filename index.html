<style>
    .calendar {
        width:150px;
        height:100px;
        position:absolute;
        background-color: whitesmoke;
        border: 10px solid teal;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
  }
    .calendar-top {
        width: 100%;
        height: 25px;
        flex-shrink: 0;
        background-color: teal;
    }

    .calendar-date {
        padding: 10px;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .clock {
        width:100px;
        height:100px;
        position:absolute;
        background-color: white;
        border: 10px solid black;
        border-radius: 50%;
        align-items: center;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;

    }
    .calculator {
        width: 700px;
        padding: 4px;
        background-color:gray;
        border: 70px orange;
        border-radius: 10px;
        max-inline-size: 100px;
        overflow: hidden;
        box-shadow: 2px 2px 4x #000;
        position:absolute;
    }
    .calculatoroutput {
        width:10px;
        background-color: gray;
        text-align: right;
    }
    .calculatorbuttons{
        width:100px;
        background-color: orange;
    }
    .calculatorbuttons--calculatoperator{
        width:50px;
        background-color: orchid;
    }
    .calculatorbuttons--calculatorenter{
        width:50px;
        background-color: greenyellow;
    }
    .stickynote {
        width: 100px;
        position: absolute;
        background-color: yellow;
        padding: 15px;
    }
    textarea {
        width:100%;
        height:100px;
        box-sizing:border-box;
        border: none;
        background-color: yellow;
     }
     #colorpicker {
        position: fixed;
        bottom: 10px;
        left: 10px;
     }
</style>
<body>
    <title>Your Desk</title>
    <h1 style=>mydesk vercel updated 1059</h1> 
    <button onclick="addStickyNote()">New Sticky Note</button>
<div class="calendar" id="calendar">
    <div class="calendar-top">Todays Date:</div>
    <div class="calendar-date"></div>
</div>
<div class="clock" id="clock"></div>
<div class="calculator" id="calculator">
    <input id="calculatoroutput" value="0" readonly>
    <div class="calculatorbuttons">
        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button onclick="chooseOperation('/')">/</button>
        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button onclick="chooseOperation('x')">x</button>
        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button onclick="chooseOperation('+')">+</button>
        <button onclick="addNumber('0')">0</button>
        <button onclick="chooseOperation('-')">-</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearCalculator()">AC</button>
    </div>
</div>
<div id="colorpicker">
    <input id="hexinput" placeholder="#000000">
    <button onclick="changeBackground()">Change Background</button>"
</div>
</body>
<script>
    let output = document.getElementById("calculatoroutput");

    let firstNumber = "";
    let secondNumber = "";
    let operation = "";
    let startingSecondNumber = false;

    function addNumber(number) {
        if (startingSecondNumber) {
            output.value = firstNumber + " " + operation + " ";
            startingSecondNumber = false;
        }

        if(output.value == "") {
            if (output.value == "0") {
            output.value = number; 
        } else {
            output.value += number;
         } 
        } else {
            output.value += number;
    }
}
     

    function chooseOperation(selectedOperation) {

        firstNumber = output.value;
        operation = selectedOperation;
        output.value = firstNumber + " " + operation;
        startingSecondNumber = true;
    }

    function calculate() {

        secondNumber = output.value.split(" ").pop();

        if (operation == "+") {
            output.value = Number(firstNumber) + Number(secondNumber);
        }

        if (operation == "-") {
            output.value = Number(firstNumber) - Number(secondNumber);
        }

        if (operation == "x") {
            output.value = Number(firstNumber) * Number(secondNumber);
        }
        if (operation == "/") {
            if (Number(secondNumber) === 0) {
                output.value = "Cannot divide by 0";
                operation = "";
                startingSecondNumber = true;
                return;
            }
            output.value = Number(firstNumber) / Number(secondNumber);
        }  
        
        operation = "";
        startingSecondNumber = true;
    
    }

    function clearCalculator(){
        output.value = "0";
        firstNumber = "";
        secondNumber = "";
        operation = "";
        startingSecondNumber = false;
    }

    let calculator = document.getElementById("calculator");

    calculator.onmousedown = function() {
        document.onmousemove = function(e) {
        calculator.style.left = e.clientX + "px";
        calculator.style.top = e.clientY + "px";
        };
    };
    document.onmouseup = function() {
        document.onmousemove = null
    }
    
    function updateClock() {
        document.getElementById("clock").textContent =
            new Date().toLocaleTimeString();
    } 

    setInterval(updateClock, 1000);
    updateClock();

    function updateCalendar() {
        document.querySelector(".calendar-date").textContent =
            new Date().toLocaleDateString();
    }

    setInterval(updateCalendar, 1000);
    updateCalendar();

    let clock = document.getElementById("clock");
    
    clock.onmousedown = function() {
        document.onmousemove = function(e) {
            clock.style.left = e.clientX + "px";
            clock.style.top = e.clientY + "px";
        };
    };
    document.onmouseup = function() {
        document.onmousemove = null
    }

    let calendar = document.getElementById("calendar");

    calendar.onmousedown = function(e) {
        let offsetX = e.clientX - calendar.offsetLeft;
        let offsetY = e.clientY - calendar.offsetTop;
    
        document.onmousemove = function(e) {
            calendar.style.left = (e.clientX - offsetX) + "px";
            calendar.style.top = (e.clientY - offsetY) + "px";
        };

    document.onmouseup = function() {
        document.onmousemove = null
        document.onmouseup = null;
    };
    };
    let highestLayer = 1;
    function addStickyNote() {
        
        let colors = ["red","orange","yellow","green","blue","indigo","violet", "pink", "white","brown",];
        let randomNumber = Math.floor(Math.random() * 10);
        let randomColor = colors[randomNumber];
        let note = document.createElement("div");
        note.className = "stickynote";
        note.style.backgroundColor = randomColor;
        note.style.left = "100px";
        note.style.top = "100px";

        let text = document.createElement("textarea");
        text.style.backgroundColor = randomColor;

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function() {
            note.remove();
        };

        note.appendChild(text);
        note.appendChild(deleteButton);
        document.body.appendChild(note);
        
    
    note.onmousedown = function(e) {
        highestLayer = highestLayer + 1;
        note.style.zIndex = highestLayer;

        if (e.target != note) {
            return;
        }

        let offsetX = e.clientX - note.offsetLeft;
        let offsetY = e.clientY - note.offsetTop;

        document.onmousemove = function(e) {
            note.style.left = (e.clientX - offsetX) + "px";
            note.style.top = (e.clientY - offsetY) + "px";
        };

        document.onmouseup = function() {
            document.onmousemove = null;
            document.onmouseup = null;
        };
    };
}

function changeBackground() {
    let hexInput = document.getElementById("hexinput");
    document.body.style.backgroundColor = hexInput.value;
}
</script>
