<style>
    .calendar {
        width:150px;
        height:100px;
        position:absolute;
        background-color: whitesmoke;
        border: 10px solid teal;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
  }
    .calendar-top {
        width: 100%;
        height: 25px;
        flex-shrink: 0;
        background-color: teal;
    }

    .calendar-date {
        padding: 10px;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .clock {
        width:100px;
        height:100px;
        position:absolute;
        background-color: white;
        border: 10px solid black;
        border-radius: 50%;
        align-items: center;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;

    }
    .calculator {
        width: 430px;
        padding: 4px;
        background-color:gray;
        border: 100px orange;
        border-radius: 10px;
        max-inline-size: 100px;
        overflow: hidden;
        position:absolute;
    }
    .calculatoroutput {
        width:10px;
        background-color: gray;
        text-align: right;
    }
    .calculatorbuttons{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        width:100px;
        background-color: orange;
    }
    .calculatorbuttons--calculatoperator{
        width:50px;
        background-color: orchid;
    }
    .calculatorbuttons--calculatorenter{
        width:50px;
        background-color: greenyellow;
    }
    .stickynote {
        width: 100px;
        position: absolute;
        background-color: yellow;
        padding: 15px;
    }
    textarea {
        width:100%;
        height:100px;
        box-sizing:border-box;
        border: none;
        background-color: yellow;
     }
     #colorpicker {
        position: fixed;
        bottom: 10px;
        left: 10px;
     }
     .todo {
        width: 200px;
        position: absolute;
        left: 400px;
        top: 100px;
        background-color: white;
        padding: 15px;
     }
     .stopwatch {
        width: 100px;
        height: 100px;
        position: absolute;
        left: 400px;
        top: 400px;
        background-color:azure;
        border: 10px solid black;
        padding: 15px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
     }
     .timer {
       width: 200px;
       height: 200px;
       position: absolute;
       background-color: azure;
       border: 10px solid black;
       padding: 15px;
       border-radius: 10%;
       display: flex;
       flex-direction: column;
       justify-content: center;
       align-items: center;

     }
    .coin {
        width: 90px;
        height: 90px;
        padding: 5px;
        position: absolute;
        left: 500px;
        top: 500px;
        background-color: #CD7F32;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
    }
    .weather{
        width: 200px;
        position: absolute;
        left: 700px;
        top: 100px;
        background-color: lightskyblue;
        padding: 10px;
    }
    .eightball{
        width: 180px;
        height: 180px;
        padding: 15px;
        border-radius: 50%;
        background-color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: absolute;
        color: white;
    }
    .credit {
        font: size 11px;
        margin-top: 10px;
    }
    .hidden {
        display: none !important;
    }
    #menubutton {
        position: fixed;
        top: 10px;
        left: 10x;
        z-index: 10000000000001;
    }

    #sidebar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100%;
        background-color: #fff;
        padding: 60px 10px 10px 10px;
        z-index: 100000000000;
    }
    #sidebarclose{
        position: absolute;
        top: 10px;
        right: 10px;
    }
    .d6 {
        width: 120px;
        position: absolute;
        left: 500px;
        top: 250px;
        background-color: white;
        border: 3px solid black;
        border-radius: 10px;
        padding: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #d6result {
        font-size: 40px;
        margin: 10px;
    }
</style>

    <title>Your Desk</title>
    <h1 style=>Your Desk vercel 728</h1> 
    <button id="menubutton" onclick="toggleSidebar()">Menu</button>
<div id="sidebar">
    <button id="sidebarclose" onclick="toggleSidebar()">X</button>
    <h3>Spawn Objects</h3>
    <button onclick="showWidget('calendar')">Calendar</button>
    <button onclick="showWidget('clock')">Clock</button>
    <button onclick="showWidget('calculator')">Calculator</button>
    <button onclick="showWidget('todo')">To-Do List</button>
    <button onclick="showWidget('stopwatch')">Stopwatch</button>
    <button onclick="showWidget('timer')">Timer</button>
    <button onclick="showWidget('coin')">Coin Flip</button>
    <button onclick="showWidget('weather')">Weather</button>
    <button onclick="showWidget('eightball')">8 Ball</button>
    <button onclick="showWidget('d6')">D6</button>
    <button onclick="addStickyNote()">New Sticky Note</button>
    <button onclick="clearNotes()">Clear Sticky Notes</button>
    <button>Website made by Adam Rabhi</button>
</div>
<div class="calendar hidden" id="calendar">
    <div class="calendar-top">Todays Date:</div>
    <button onclick="closeWidget('calendar')">X</button>
    <div class="calendar-date"></div>
</div>
<div class="clock hidden" id="clock"></div>
    <button onclick="closeWidget('clock')">X</button>
<div class="calculator hidden" id="calculator">
    <button onclick="closeWidget('calculator')">X</button>
    <input id="calculatoroutput" value="0" readonly>
    <div class="calculatorbuttons">
        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button onclick="chooseOperation('/')">/</button>
        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button onclick="chooseOperation('x')">x</button>
        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button onclick="chooseOperation('+')">+</button>
        <button onclick="addNumber('0')">0</button>
        <button onclick="chooseOperation('-')">-</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearCalculator()">AC</button>
    </div>
</div>
<div id="colorpicker hidden">
    <input id="hexinput" placeholder="#000000">
    <button onclick="changeBackground()">Change Background</button>
</div>
<div class="todo hidden" id="todo">
    <button onclick="closeWidget('todo')">X</button>
    <h3>To-Do List</h3>
    <input id="todoinput" placeholder="New task">
    <button onclick="addTask()">Add</button>
    <ul id="todolist"></ul>
 </div>
<div class="stopwatch hidden" id="stopwatch">
    <button onclick="closeWidget('stopwatch')">X</button>
    <h3>Stopwatch</h3>
    <div id="stopwatchtime">00:00:00.000</div>
    <button onclick="startStopwatch()">Start</button>
    <button onclick="stopStopwatch()">Stop</button>
    <button onclick="resetStopwatch()">Reset</button>
</div>
<div class="timer hidden" id="timer">
    <button onclick="closeWidget('timer')">X</button>
    <h3>Timer</h3>
    <input id="timerinput" type="number" placeholder="Seconds">
    <div id="timertime">00:00:00.000</div>
    <button onclick="startTimer()">Start</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="addMinute()">Add Minute</button>
    <button onclick="addHour()">Add Hour</button>
</div>
<div class="coin hidden" id="coin">
    <button onclick="closeWidget('coin')">X</button>

    let output = document.getElementById("calculatoroutput");

    let firstNumber = "";
    let secondNumber = "";
    let operation = "";
    let startingSecondNumber = false;

    function addNumber(number) {
        if (startingSecondNumber) {
            output.value = firstNumber + " " + operation + " ";
            startingSecondNumber = false;
        }

        if(output.value == "") {
            if (output.value == "0") {
            output.value = number; 
        } else {
            output.value += number;
         } 
        } else {
            output.value += number;
    }
}
     

    function chooseOperation(selectedOperation) {

        firstNumber = output.value;
        operation = selectedOperation;
        output.value = firstNumber + " " + operation;
        startingSecondNumber = true;
    }

    function calculate() {

        secondNumber = output.value.split(" ").pop();

        if (operation == "+") {
            output.value = Number(firstNumber) + Number(secondNumber);
        }

        if (operation == "-") {
            output.value = Number(firstNumber) - Number(secondNumber);
        }

        if (operation == "x") {
            output.value = Number(firstNumber) * Number(secondNumber);
        }
        if (operation == "/") {
            if (Number(secondNumber) === 0) {
                output.value = "Cannot divide by 0";
                operation = "";
                startingSecondNumber = true;
                return;
            }
            output.value = Number(firstNumber) / Number(secondNumber);
        }  
        
        operation = "";
        startingSecondNumber = true;
    
    }

        output.value = "0";

    function addStickyNote() {
        
        let colors = ["red","orange","yellow","green","blue","indigo","violet", "pink", "white","brown",];
        let randomNumber = Math.floor(Math.random() * 10);
        let randomColor = colors[randomNumber];
        let note = document.createElement("div");
        note.className = "stickynote";
        note.style.backgroundColor = randomColor;
        note.style.left = "100px";
        note.style.top = "100px";

        let text = document.createElement("textarea");
        text.style.backgroundColor = randomColor;

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function() {
            note.remove();
        };

        note.appendChild(text);
        note.appendChild(deleteButton);
        document.body.appendChild(note);
        
    
    note.onmousedown = function(e) {
        highestLayer = highestLayer + 1;
        note.style.zIndex = highestLayer;

        let offsetY = e.clientY - note.offsetTop;

        document.onmousemove = function(e) {

let totalMs = 0;
let running = false;

function showTime() {
    let hours = Math.floor(totalMs / 3600000);
    let minutes = Math.floor(totalMs / 60000) % 60;
    let seconds = Math.floor(totalMs / 1000) % 60;
    let milliseconds = totalMs % 1000;

    hours = String(hours).padStart(2, "0");
    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");
    milliseconds = String(milliseconds).padStart(3,"0");

    document.getElementById("stopwatchtime").textContent =
    hours + ":" + minutes + ":" + seconds + "." + milliseconds;
}
let stopwatchInterval = null;

function startStopwatch() {
    if (running) {
        return;
    }
    
    running = true;
    stopwatchInterval = setInterval(function() {
        totalMs = totalMs + 10;
        showTime(); }, 10); 
}

function stopStopwatch() {
    clearInterval(stopwatchInterval);
    running = false;
}

function resetStopwatch() {
    clearInterval(stopwatchInterval);
    running = false;
    totalMs = 0;
    showTime();
}

    async function getWeather() {
        let city = document.getElementById("cityinput").value;

        try {
            let geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + city + "&count=1";
            let geoResponse = await fetch(geoUrl);
            let geoData = await geoResponse.json();

            if (geoData.results == undefined) {
                document.getElementById("weathernow").textContent = "City not found";
                document.getElementById("weathertype").textContent = "";
                document.getElementById("weatherdays").innerHTML = "";
                return;
            }

         let latitude = geoData.results[0].latitude;
         let longitude = geoData.results[0].longitude;
         let cityName = geoData.results[0].name;

        let url = "https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude + "&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto";

         let response = await fetch(url);
         let data = await response.json();

         document.getElementById("weathernow").textContent = cityName + " now: " + data.current_weather.temperature + "F";

        let code = data.current_weather.weathercode;
        let isRaining = false;

        if (code >= 51 && code <= 67) { // hehe 67
            isRaining = true;
        }
        if (code >= 95) {
            isRaining = true;
        }
        
        if (isRaining) {
            document.getElementById("weathertype").textContent = "Its Raining ):";
        } else {
            document.getElementById("weathertype").textContent = "Its Sunny!";
        }
         let days = document.getElementById("weatherdays");
         days.innerHTML = "";

         for (let i = 0; i < 3; i++) {
            let line = document.createElement("div");
            line.textContent = data.daily.time[i] + ": " + data.daily.temperature_2m_max[i] + "° / " + data.daily.temperature_2m_min[i] + "°";
            days.appendChild(line);
         }
        } catch (error) {
            document.getElementById("weathernow").textContent = "Couldnt load weather";
        }
    }

    getWeather();
