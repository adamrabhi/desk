<!DOCTYPE html>
<html>
<style>
    .calculator {
        width: 300px;
        padding: 20px;
        background-color:aqua;
        border: 2px orange;
        border-radius: 8px;
    }
    .calculatoroutput {
        width:50px;
        background-color: gray;
    }
    .calculatorbuttons{
        width:50px;
        background-color: orange;
    }
    .calculatorbuttons--calculatoperator{
        width:50px;
    }
    .calculatorbuttons--calculatorenter{
        width:50px;
    }
</style>
<body>
    <h1>mydesk</h1>
<div class="calculator">
    <div class="calculatorout"</div>
    <div class="calculatorbuttons"</div>
        <button class="calculatorbuttons--calculatoroperator">+</button>
        <button class="calculatorbuttons calculatoroperator">-</button>
        <button class="calculatorbuttons calculatoroperator">x</button>
        <button class="calculatorbuttons calculatoroperator">/</button>
        <button class="calculatorbuttons">1</button>
        <button class="calculatorbuttons">2</button>
        <button class="calculatorbuttons">3</button>
        <button class="calculatorbuttons">4</button>
        <button class="calculatorbuttons">5</button>
        <button class="calculatorbuttons">6</button>
        <button class="calculatorbuttons">7</button>
        <button class="calculatorbuttons">8</button>
        <button class="calculatorbuttons">9</button>
        <button class="calculatorbuttons--calculatorenter">=</button>
    </div>
</div>
</body>

</html>
